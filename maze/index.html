<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Find each other · Erika &amp; Brendan</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBFAF7;
    --cream-deep: #F2EEE6;
    --ink: oklch(0.22 0.015 50);
    --ink-soft: oklch(0.42 0.02 50);
    --camel: oklch(0.62 0.09 55);
    --camel-deep: oklch(0.48 0.08 50);
    --dusk: oklch(0.42 0.035 240);
    --hairline: #E6E1D7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Jost', system-ui, sans-serif;
    font-weight: 300;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 56px 24px 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap { width: 100%; max-width: 660px; text-align: center; }

  .eyebrow {
    font-family: 'Mrs Saint Delafield', cursive;
    font-size: 44px; line-height: 1;
    color: var(--camel);
    margin-bottom: 6px;
  }
  h1 {
    font-family: 'Bellefair', serif;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: clamp(30px, 6vw, 50px);
    font-weight: 400;
    line-height: 1.05;
  }
  .rule { width: 36px; height: 1px; background: var(--camel); margin: 22px auto 0; }
  .lede {
    font-family: 'Bellefair', serif;
    font-style: italic;
    font-size: clamp(17px, 2.4vw, 21px);
    color: var(--ink-soft);
    line-height: 1.55;
    max-width: 430px;
    margin: 24px auto 0;
  }
  /* the header text cross-fades when the games swap */
  .fade { transition: opacity .28s ease; }
  .fade.out { opacity: 0; }

  .board {
    margin: 40px auto 0;
    padding: 16px;
    background: var(--cream-deep);
    border: 1px solid var(--hairline);
    display: inline-block;
    line-height: 0;
  }
  /* the two games sit side by side and slide across */
  .stage { overflow: hidden; }
  .track {
    display: flex;
    width: 200%;
    transition: transform .65s cubic-bezier(.7, 0, .2, 1);
  }
  .panel { width: 50%; flex: 0 0 50%; }
  canvas {
    touch-action: none;
    outline: none;
    display: block;
  }
  #maze { cursor: crosshair; }
  #run { cursor: pointer; }
  canvas:focus-visible { box-shadow: 0 0 0 2px var(--camel); }

  .hint {
    margin-top: 22px;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .hint b { font-weight: 500; color: var(--ink); }

  /* display:none keeps it from reserving space; the keyframe still animates it in */
  .win { display: none; margin-top: 30px; pointer-events: none; }
  .win.show { display: block; animation: rise .55s ease both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  .win .line {
    font-family: 'Mrs Saint Delafield', cursive;
    font-size: clamp(46px, 8.5vw, 64px);
    line-height: 1.1;
    color: var(--camel);
  }
  .win .time {
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* a loss gets a quieter note, not the big script */
  .over { display: none; margin-top: 26px; }
  .over.show { display: block; animation: rise .4s ease both; }
  .over span {
    font-family: 'Bellefair', serif;
    font-style: italic;
    font-size: clamp(18px, 2.4vw, 22px);
    color: var(--ink-soft);
  }

  .controls {
    margin-top: 26px;
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
  }
  /* display:contents lets the grouped buttons sit in the same flex row */
  .grp { display: contents; }
  .grp[hidden] { display: none; }
  /* Pinned to the viewport: in the controls row it fell below the fold on
     most laptops, which made it impossible to find. */
  #expandBtn {
    position: fixed;
    top: 14px; right: 14px;
    z-index: 60;
    padding: 10px 18px;
    background: var(--cream);
    border-color: var(--camel);
    color: var(--camel-deep);
    box-shadow: 0 1px 6px oklch(0.22 0.015 50 / 0.10);
  }

  /* full screen: drop the page furniture and give the board the room */
  body.expanded { padding: 14px 12px 18px; justify-content: center; }
  body.expanded .wrap { max-width: none; }
  body.expanded .eyebrow,
  body.expanded h1,
  body.expanded .rule,
  body.expanded .lede,
  body.expanded .back { display: none; }
  body.expanded .board { margin-top: 0; }
  body.expanded .hint { margin-top: 14px; }
  body.expanded .win { margin-top: 16px; }
  body.expanded .controls { margin-top: 18px; }
  button {
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    padding: 13px 26px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--hairline);
    cursor: pointer;
    transition: border-color .2s, color .2s;
  }
  button:hover { border-color: var(--camel); color: var(--camel-deep); }

  .back {
    display: inline-block;
    margin-top: 30px;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-decoration: none;
    transition: color .2s;
  }
  .back:hover { color: var(--camel); }

  @media (max-width: 560px) {
    body { padding: 40px 16px 36px; }
    .board { padding: 10px; }
    .kb { display: none; }   /* no arrow keys on a phone */
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow fade" id="eyebrow">a little detour</div>
    <h1 class="fade" id="title">Run to her</h1>
    <div class="rule"></div>
    <p class="lede fade" id="lede">
      Erika is waiting at a hundred. Get Brendan over everything in the way.
    </p>

    <div class="board">
      <div class="stage" id="stage">
        <div class="track" id="track">
          <div class="panel">
            <canvas id="run" tabindex="0" aria-label="Running game: jump Brendan over obstacles to reach Erika"></canvas>
          </div>
          <div class="panel">
            <canvas id="maze" tabindex="0" aria-label="Maze puzzle: draw a path from Erika to Brendan"></canvas>
          </div>
        </div>
      </div>
    </div>

    <p class="hint fade" id="hint">Tap, or press space, to start</p>

    <div class="win" id="win">
      <div class="line" id="winLine">you found each other</div>
      <div class="time" id="time"></div>
    </div>

    <div class="over" id="over"><span id="overText"></span></div>

    <div class="controls">
      <span class="grp" id="runControls">
        <button id="restartBtn">Run again</button>
        <button id="backBtn">Try the maze</button>
      </span>
      <span class="grp" id="mazeControls" hidden>
        <button id="newBtn">New maze</button>
        <button id="clearBtn">Clear the line</button>
        <button id="nextBtn">Back to the run</button>
      </span>
      <button id="expandBtn">Full screen</button>
    </div>

    <a class="back" href="/">&larr; back to the wedding</a>
  </div>

<script>
(function () {
  var CREAM = '#FBFAF7';
  var WALL  = 'oklch(0.22 0.015 50)';
  var SOFT  = 'oklch(0.42 0.02 50)';
  var CAMEL = 'oklch(0.62 0.09 55)';   // Erika
  var DUSK  = 'oklch(0.42 0.035 240)'; // Brendan

  var canvas = document.getElementById('maze');
  var ctx = canvas.getContext('2d');
  var winEl = document.getElementById('win');
  var winLine = document.getElementById('winLine');
  var timeEl = document.getElementById('time');
  var overEl = document.getElementById('over');
  var overText = document.getElementById('overText');
  var track = document.getElementById('track');
  var stage = document.getElementById('stage');

  var cols, rows, cell, cells, path, dragging, won, startedAt, elapsed;
  var current = 'run';

  // ── Maze generation (recursive backtracker → a perfect maze,
  //    so exactly one route joins any two cells) ───────────────
  // walls: [top, right, bottom, left]
  var DIRS = [
    { dx: 0, dy: -1, wall: 0, opp: 2 },
    { dx: 1, dy: 0,  wall: 1, opp: 3 },
    { dx: 0, dy: 1,  wall: 2, opp: 0 },
    { dx: -1, dy: 0, wall: 3, opp: 1 }
  ];

  function generate() {
    cells = [];
    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++) {
        cells.push({ x: x, y: y, walls: [true, true, true, true], seen: false });
      }
    }
    var stack = [];
    var current = cells[0];
    current.seen = true;
    var visited = 1;
    var total = cols * rows;

    while (visited < total) {
      var options = [];
      for (var i = 0; i < DIRS.length; i++) {
        var d = DIRS[i];
        var nx = current.x + d.dx, ny = current.y + d.dy;
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
        var n = cells[ny * cols + nx];
        if (!n.seen) options.push({ cell: n, wall: d.wall, opp: d.opp });
      }
      if (options.length) {
        var pick = options[(Math.random() * options.length) | 0];
        current.walls[pick.wall] = false;
        pick.cell.walls[pick.opp] = false;
        stack.push(current);
        current = pick.cell;
        current.seen = true;
        visited++;
      } else {
        current = stack.pop();
      }
    }
  }

  function startCell() { return { x: 0, y: 0 }; }
  function endCell()   { return { x: cols - 1, y: rows - 1 }; }

  // ── Sizing (both games share one frame so the swipe is seamless) ──
  function layout() {
    var portrait = window.innerWidth < 620;
    cols = portrait ? 11 : 17;
    rows = portrait ? 8 : 12;   // keeps the frame's shape near the desktop's

    var big = document.body.classList.contains('expanded');
    var board = canvas.closest('.board');
    var pad = portrait ? 20 : 32;
    var availW = Math.min(board.parentNode.clientWidth, big ? 1800 : 660) - pad;
    var availH = Math.max(300, window.innerHeight - (big ? 190 : 340));

    cell = Math.floor(Math.min(availW / cols, availH / rows));
    cell = Math.max(cell, 18);

    var w = cell * cols, h = cell * rows;
    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    runLayout(w, h, dpr);
  }

  // ── Maze drawing ──────────────────────────────────────────
  function centre(p) {
    return { x: p.x * cell + cell / 2, y: p.y * cell + cell / 2 };
  }

  function draw() {
    var w = cell * cols, h = cell * rows;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, w, h);

    // the drawn line, camel at Erika's end fading to dusk at Brendan's
    if (path.length > 1) {
      var a = centre(startCell()), b = centre(endCell());
      var grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      grad.addColorStop(0, CAMEL);
      grad.addColorStop(1, DUSK);
      ctx.beginPath();
      for (var i = 0; i < path.length; i++) {
        var c = centre(path[i]);
        if (i === 0) ctx.moveTo(c.x, c.y); else ctx.lineTo(c.x, c.y);
      }
      ctx.strokeStyle = grad;
      ctx.lineWidth = Math.max(4, cell * 0.34);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.globalAlpha = won ? 1 : 0.75;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // walls
    ctx.strokeStyle = WALL;
    ctx.lineWidth = Math.max(1.5, cell * 0.075);
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (var j = 0; j < cells.length; j++) {
      var c2 = cells[j];
      var x = c2.x * cell, y = c2.y * cell;
      if (c2.walls[0]) { ctx.moveTo(x, y); ctx.lineTo(x + cell, y); }
      if (c2.walls[3]) { ctx.moveTo(x, y); ctx.lineTo(x, y + cell); }
      if (c2.x === cols - 1 && c2.walls[1]) { ctx.moveTo(x + cell, y); ctx.lineTo(x + cell, y + cell); }
      if (c2.y === rows - 1 && c2.walls[2]) { ctx.moveTo(x, y + cell); ctx.lineTo(x + cell, y + cell); }
    }
    ctx.stroke();

    marker(startCell(), 'E', CAMEL);
    marker(endCell(), 'B', DUSK);
  }

  function marker(p, letter, colour) {
    var c = centre(p);
    var r = cell * 0.33;
    ctx.beginPath();
    ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
    ctx.fillStyle = colour;
    ctx.fill();
    ctx.fillStyle = CREAM;
    ctx.font = '400 ' + Math.round(cell * 0.42) + "px 'Bellefair', serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(letter, c.x, c.y + cell * 0.02);
  }

  // ── Maze path logic ───────────────────────────────────────
  function same(a, b) { return a && b && a.x === b.x && a.y === b.y; }

  function canStep(from, to) {
    var dx = to.x - from.x, dy = to.y - from.y;
    if (Math.abs(dx) + Math.abs(dy) !== 1) return false;
    var c = cells[from.y * cols + from.x];
    if (dx === 1)  return !c.walls[1];
    if (dx === -1) return !c.walls[3];
    if (dy === 1)  return !c.walls[2];
    return !c.walls[0];
  }

  function step(to) {
    if (won) return;
    var last = path[path.length - 1];
    if (same(to, last)) return;

    // walking back over the previous cell rubs the line out
    if (path.length > 1 && same(to, path[path.length - 2])) {
      path.pop();
      draw();
      return;
    }
    if (!canStep(last, to)) return;

    // don't let the line cross itself
    for (var i = 0; i < path.length; i++) if (same(path[i], to)) return;

    if (startedAt === null) startedAt = Date.now();
    path.push(to);

    if (same(to, endCell())) finish();
    draw();
  }

  function finish() {
    won = true;
    elapsed = startedAt ? Math.round((Date.now() - startedAt) / 1000) : 0;
    winLine.textContent = 'you found each other';
    if (elapsed < 60) {
      timeEl.textContent = 'in ' + elapsed + (elapsed === 1 ? ' second' : ' seconds');
    } else {
      var m = Math.floor(elapsed / 60), s = elapsed % 60;
      timeEl.textContent = 'in ' + m + ' min ' + (s < 10 ? '0' : '') + s + ' sec';
    }
    winEl.classList.add('show');
  }

  function cellAt(e) {
    var rect = canvas.getBoundingClientRect();
    var x = Math.floor((e.clientX - rect.left) / (rect.width / cols));
    var y = Math.floor((e.clientY - rect.top) / (rect.height / rows));
    if (x < 0 || y < 0 || x >= cols || y >= rows) return null;
    return { x: x, y: y };
  }

  // ── Maze input ────────────────────────────────────────────
  canvas.addEventListener('pointerdown', function (e) {
    if (won) return;
    var c = cellAt(e);
    if (!c) return;
    canvas.focus();

    // grabbing a cell already on the line rewinds back to it
    for (var i = 0; i < path.length; i++) {
      if (same(path[i], c)) {
        path.length = i + 1;
        dragging = true;
        canvas.setPointerCapture(e.pointerId);
        draw();
        return;
      }
    }
    // otherwise you can only pick the line up from where it left off
    if (canStep(path[path.length - 1], c)) {
      dragging = true;
      canvas.setPointerCapture(e.pointerId);
      step(c);
    }
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!dragging || won) return;
    e.preventDefault();
    var c = cellAt(e);
    if (c) step(c);
  });

  function release(e) {
    if (!dragging) return;
    dragging = false;
    if (canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
      canvas.releasePointerCapture(e.pointerId);
    }
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);

  var KEYS = {
    ArrowUp: { dx: 0, dy: -1 }, ArrowRight: { dx: 1, dy: 0 },
    ArrowDown: { dx: 0, dy: 1 }, ArrowLeft: { dx: -1, dy: 0 }
  };
  canvas.addEventListener('keydown', function (e) {
    var d = KEYS[e.key];
    if (!d || won) return;
    e.preventDefault();
    var last = path[path.length - 1];
    step({ x: last.x + d.dx, y: last.y + d.dy });
  });

  function clearLine() {
    path = [startCell()];
    won = false;
    dragging = false;
    startedAt = null;
    winEl.classList.remove('show');
    draw();
  }

  function newMaze() {
    layout();
    generate();
    clearLine();
  }

  // ══════════════════════════════════════════════════════════
  // THE RUN — Brendan covers a hundred to reach Erika
  // ══════════════════════════════════════════════════════════
  var rc = document.getElementById('run');
  var rx = rc.getContext('2d');
  var R = { w: 0, h: 0, ground: 0, figH: 0, px: 4 };

  // ── Artwork ───────────────────────────────────────────────
  // Erika and Brendan's own sprites. Each is trimmed to its ink on load
  // so every frame shares one baseline, otherwise he bobs as the run
  // cycle plays.
  var ART = {};
  var ARTFILES = {
    run1: 'sprites/brendan-run-1.png', run2: 'sprites/brendan-run-2.png',
    run3: 'sprites/brendan-run-3.png', run4: 'sprites/brendan-run-4.png',
    run5: 'sprites/brendan-run-5.png', run6: 'sprites/brendan-run-6.png',
    run7: 'sprites/brendan-run-7.png', run8: 'sprites/brendan-run-8.png',
    jump: 'sprites/brendan-jump.png', trip: 'sprites/brendan-trip.png',
    wait: 'sprites/erika-wait.png',   spot: 'sprites/erika-spot.png',
    heart: 'sprites/erika-heart.png', embrace: 'sprites/embrace.png',
    bush: 'sprites/bush.png',         pine: 'sprites/pine.png'
  };
  var RUN_KEYS = ['run1','run2','run3','run4','run5','run6','run7','run8'];
  var artReady = false;

  // ── Scenery, after the lake at Kawaguchiko: Fuji and the far shore on
  //    the horizon, the town below it, then scrub and the path underfoot.
  //    Each band scrolls at its own rate and picks from a pool, so the
  //    view keeps changing as he runs.
  var BG = {};
  var BGDIR = 'background/';
  var BGFILES = ['mountain_lake_backdrop','autumn_forest_row',
    'tree_autumn_large','bare_tree',
    'bench','lamp_post','signpost',
    'ground_tile_04',
    'weeds_01','weeds_02','weeds_04','weeds_05',
    'grass_tuft_dry','rock_small','rock_pair',
    'cloud_01','cloud_02','cloud_03','cloud_04','cloud_05','cloud_06','cloud_07','cloud_08',
    'birds_01','birds_02','birds_03','birds_04','birds_05','birds_06','birds_07','birds_08',
    'sun_02'];

  // Only things nobody would mistake for the green pine or bush you jump.
  var MID_POOL  = ['bench','lamp_post','signpost','tree_autumn_large','bare_tree'];
  var RARE_POOL = ['bench','lamp_post','signpost'];
  // Nothing below the path that could pass for an obstacle: small growth only.
  var FORE_POOL = ['weeds_01','weeds_02','weeds_04','weeds_05','grass_tuft_dry','rock_small'];
  var CLOUDS    = ['cloud_01','cloud_02','cloud_03','cloud_04','cloud_05','cloud_06','cloud_07','cloud_08'];
  var BIRDS     = ['birds_01','birds_02','birds_03','birds_04','birds_05','birds_06','birds_07','birds_08'];
  var GROUNDS   = ['ground_tile_04'];   // grass over earth, in one seamless piece

  function pick(a) { return a[(Math.random() * a.length) | 0]; }
  function horizon() { return R.ground - R.h * 0.17; }

  function trim(img) {
    var c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    var g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    var d = g.getImageData(0, 0, c.width, c.height).data;
    var minX = c.width, minY = c.height, maxX = -1, maxY = -1;
    for (var y = 0; y < c.height; y++) {
      for (var x = 0; x < c.width; x++) {
        if (d[(y * c.width + x) * 4 + 3] < 16) continue;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
    if (maxX < 0) return c;
    var w = maxX - minX + 1, h = maxY - minY + 1;
    var t = document.createElement('canvas');
    t.width = w; t.height = h;
    t.getContext('2d').drawImage(c, minX, minY, w, h, 0, 0, w, h);
    return t;
  }

  function loadArt(done) {
    var names = Object.keys(ARTFILES), left = names.length + BGFILES.length;
    BGFILES.forEach(function (n) {
      var im = new Image();
      im.onload = function () { BG[n] = trim(im); if (--left === 0) { artReady = true; done(); } };
      im.onerror = function () { if (--left === 0) { artReady = true; done(); } };
      im.src = BGDIR + n + '.png';
    });
    if (!left) { done(); return; }
    names.forEach(function (n) {
      var img = new Image();
      img.onload = function () {
        ART[n] = trim(img);
        if (--left === 0) { artReady = true; done(); }
      };
      img.onerror = function () {
        if (--left === 0) { artReady = true; done(); }
      };
      img.src = ARTFILES[n];
    });
  }

  // draw a scenery image by its base, left edge at x
  function drawBG(key, x, baseY, h, flip, alpha) {
    var im = BG[key];
    if (!im) return;
    var w = im.width * (h / im.height);
    rx.imageSmoothingEnabled = true;
    rx.imageSmoothingQuality = 'high';
    if (alpha !== undefined) rx.globalAlpha = alpha;
    if (flip) {
      rx.save();
      rx.translate(Math.round(x) + w, Math.round(baseY - h));
      rx.scale(-1, 1);
      rx.drawImage(im, 0, 0, w, h);
      rx.restore();
    } else {
      rx.drawImage(im, Math.round(x), Math.round(baseY - h), w, h);
    }
    if (alpha !== undefined) rx.globalAlpha = 1;
    return w;
  }

  // repeat an image across the width at a scroll offset
  // Scaling an image every frame blends its outer pixels toward transparent,
  // which is what leaves a pale line at every join. So each strip is composed
  // once into a canvas holding the tile beside a mirrored copy: the inner
  // join matches by symmetry, and so do the two outer edges, which makes the
  // whole thing repeat cleanly. That canvas is then blitted 1:1 at whole
  // pixels, so nothing is ever resampled and no seam can appear.
  var tileCache = new Map();
  function seamlessTile(key, h) {
    var im = BG[key];
    if (!im) return null;
    var byH = tileCache.get(key);
    if (!byH) { byH = {}; tileCache.set(key, byH); }
    // built at device resolution: anything else gets scaled up on the way
    // to the screen, and that rescale is what puts the pale line back
    var kh = Math.max(2, Math.round(h * (R.dpr || 1)));
    if (byH[kh]) return byH[kh];
    var w = Math.max(2, Math.round(im.width * (kh / im.height)));
    var cv = document.createElement('canvas');
    cv.width = w * 2; cv.height = kh;
    var g = cv.getContext('2d');
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    // Drop the outermost column each side: it is a soft edge left by the
    // cut, and mirroring would sit two of them together as a pale line.
    var sx = im.width > 4 ? 1 : 0;
    var sw = im.width > 4 ? im.width - 2 : im.width;
    g.drawImage(im, sx, 0, sw, im.height, 0, 0, w, kh);
    g.save();
    g.translate(w * 2, 0);
    g.scale(-1, 1);
    g.drawImage(im, sx, 0, sw, im.height, 0, 0, w, kh);
    g.restore();
    byH[kh] = cv;
    return cv;
  }

  function tileSeamless(key, off, baseY, h, alpha) {
    var cv = seamlessTile(key, h);
    if (!cv) return;
    var d = R.dpr || 1;
    var w = cv.width;
    rx.save();
    rx.setTransform(1, 0, 0, 1, 0, 0);   // device pixels, so nothing resamples
    if (alpha !== undefined) rx.globalAlpha = alpha;
    var top = Math.round(baseY * d) - cv.height;
    var offD = off * d;
    var start = -Math.round(((offD % w) + w) % w);
    for (var x = start; x < R.w * d; x += w) rx.drawImage(cv, x, top);
    rx.restore();
  }

  function tileBG(key, off, baseY, h, alpha, mirror) {
    var im = BG[key];
    if (!im) return;
    var w = im.width * (h / im.height);
    if (w < 2) return;
    rx.imageSmoothingEnabled = true;
    rx.imageSmoothingQuality = 'high';
    if (alpha !== undefined) rx.globalAlpha = alpha;
    var idx0 = Math.floor(off / w);
    var start = -(((off % w) + w) % w);
    var i = 0;
    for (var x = start; x < R.w; x += w, i++) {
      if (mirror && ((((idx0 + i) % 2) + 2) % 2) === 1) {
        rx.save();
        rx.translate(x + w, baseY - h);
        rx.scale(-1, 1);
        rx.drawImage(im, 0, 0, w + 2, h);
        rx.restore();
      } else {
        rx.drawImage(im, x, baseY - h, w + 2, h);
      }
    }
    if (alpha !== undefined) rx.globalAlpha = 1;
  }

  // draw an image by its feet, centred on cx
  function drawArt(key, cx, feetY, h, flip) {
    var img = ART[key];
    if (!img) return;
    var w = img.width * (h / img.height);
    var left = Math.round(cx - w / 2), top = Math.round(feetY - h);
    rx.imageSmoothingEnabled = true;
    rx.imageSmoothingQuality = 'high';
    if (flip) {
      rx.save();
      rx.translate(left + w, top);
      rx.scale(-1, 1);
      rx.drawImage(img, 0, 0, w, h);
      rx.restore();
    } else {
      rx.drawImage(img, left, top, w, h);
    }
  }


  var G = null;      // game state
  var raf = null;
  var lastT = 0;

  function runLayout(w, h, dpr) {
    rc.style.width = w + 'px';
    rc.style.height = h + 'px';
    rc.width = Math.round(w * dpr);
    rc.height = Math.round(h * dpr);
    rx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R.w = w; R.h = h; R.dpr = dpr;
    tileCache.clear();
    R.ground = h * 0.82;
    // Everything about the run derives from this one unit, and the unit comes
    // from the width. Sizing obstacles off the height while speed came off the
    // width made a phone's tall frame nearly unplayable: a jump covered 104px
    // against an 88px obstacle, leaving 31ms to time it against 329ms on a
    // desktop. Off a single unit, every device gets the same game.
    R.figH = Math.max(24, Math.round(w * 0.18));
    if (G) { G.y = Math.min(G.y, 0); drawRun(); }
  }

  function newGame() {
    G = {
      phase: 'ready',          // ready → run → meet → won | over
      x: R.w * 0.16,
      y: 0,                    // height above ground (positive = airborne)
      vy: 0,
      speed: R.figH * 0.04,
      score: 0,
      t: 0,                    // bob/idle phase
      stride: 0,               // run-cycle position, driven by distance
      obstacles: [],
      pebbles: [],
      nextGap: R.figH * 3,
      since: 0,
      erikaX: null,
      hug: 0,
      paused: false,
      sky: { backdrop: 0, town: 0, forest: 0, shore: 0, ground: 0 },
      clouds: [], birds: [], mid: [], fore: [],
      nextMid: 0, nextFore: 0, nextBird: 0,
      groundKey: pick(GROUNDS)
    };
    // seed the view so it does not start empty
    for (var ci = 0; ci < 3; ci++) {
      G.clouds.push({ x: Math.random() * R.w, y: R.h * (0.05 + Math.random() * 0.24),
                      k: pick(CLOUDS), h: R.h * (0.05 + Math.random() * 0.05),
                      a: 0.55 + Math.random() * 0.3 });
    }
    for (var mi = 0; mi < 2; mi++) addMid(Math.random() * R.w);
    for (var fi = 0; fi < 4; fi++) addFore(Math.random() * R.w);
    G.nextMid = R.w * 0.7;
    G.nextFore = R.w * 0.3;
    G.nextBird = R.w * (4 + Math.random() * 6);

    winEl.classList.remove('show');
    overEl.classList.remove('show');
    drawRun();
  }

  // Scenery picks from a pool with jittered size, spacing and flip, so the
  // same handful of assets does not read as a repeating strip.
  // A prop's size follows how far down the scrub band it sits, so the
  // nearer ones read as nearer. Everything stays clear of the path.
  var MID_SIZE = {
    tree_autumn_large: 0.115, bare_tree: 0.10,
    bench: 0.055, lamp_post: 0.10, signpost: 0.07
  };

  function addMid(x) {
    var rare = Math.random() < 0.1;
    var k = rare ? pick(RARE_POOL) : pick(MID_POOL);
    var band = R.ground - horizon();
    var t = Math.random();                       // 0 far, 1 near
    G.mid.push({
      x: x, k: k,
      h: R.h * (MID_SIZE[k] || 0.08) * (0.72 + t * 0.55) * (0.85 + Math.random() * 0.3),
      flip: !rare && Math.random() < 0.5,
      drop: band * (0.55 + t * 0.42),            // stands along the path
      a: 0.78 + t * 0.2
    });
  }

  function addFore(x) {
    G.fore.push({
      x: x, k: pick(FORE_POOL),
      h: R.h * (0.035 + Math.random() * 0.055),
      flip: Math.random() < 0.5,
      drop: R.h * (0.005 + Math.random() * 0.035)  // just below the path, nearest the eye
    });
  }

  var GRAV, JUMPV;
  function tuneJump() {
    GRAV  = R.figH * 0.00617;
    // Airtime, not height, is what makes this fair: it has to stay long enough
    // that landing clears an obstacle's trailing edge, which leaves roughly a
    // third of a second to time each jump.
    JUMPV = R.figH * 0.135;
  }

  function jump() {
    if (!G) return;
    if (G.phase === 'over') { newGame(); loop(); return; }
    // the run waits on the first press, so nobody arrives mid-stride
    if (G.paused) {                       // resume after a resize
      G.paused = false;
      setHint(COPY.run.hint);
      if (!raf) loop();
      return;
    }
    if (G.phase === 'ready') {
      G.phase = 'run';
      setHint(COPY.run.hint);
      G.vy = JUMPV;
      if (!raf) loop();
      return;
    }
    if (G.phase !== 'run' && G.phase !== 'meet') return;
    if (G.y <= 0.01) { G.vy = JUMPV; }
  }

  function spawn() {
    // every obstacle is clearable: heights stay well under the jump apex
    var tall = Math.random() < 0.4;
    var key = tall ? 'pine' : 'bush';
    var img = ART[key];
    var oh = R.figH * (tall ? 0.78 : 0.36);
    var ow = img ? img.width * (oh / img.height) : oh;
    // the hit box is narrower than the drawing, so a clipped branch forgives
    G.obstacles.push({ x: R.w + ow, w: ow, h: oh, cw: ow * 0.7, art: key });
  }

  function tick(dt) {
    if (G.phase === 'over' || G.phase === 'won' || G.paused) return;
    var idling = G.phase === 'ready';

    G.t += dt * 0.32;
    // one full 6-frame cycle per two strides of ground covered
    G.stride += (G.speed * dt) / (R.figH * 0.30);

    // vertical motion
    G.y += G.vy * dt;
    G.vy -= GRAV * dt;
    if (G.y < 0) { G.y = 0; G.vy = 0; }

    // every band at its own rate: the mountain barely moves, the weeds fly
    var sp = G.speed * dt;
    G.sky.backdrop += sp * 0.04;
    G.sky.forest   += sp * 0.26;
    G.sky.ground   += sp;

    for (var ci = G.clouds.length - 1; ci >= 0; ci--) {
      var cl = G.clouds[ci];
      cl.x -= sp * 0.05;
      if (cl.x + R.w * 0.3 < 0) {
        G.clouds.splice(ci, 1);
        G.clouds.push({ x: R.w + Math.random() * R.w * 0.6,
                        y: R.h * (0.05 + Math.random() * 0.24), k: pick(CLOUDS),
                        h: R.h * (0.05 + Math.random() * 0.05),
                        a: 0.55 + Math.random() * 0.3 });
      }
    }

    G.nextBird -= sp;
    if (G.nextBird <= 0) {
      G.birds.push({ x: R.w + 20, y: R.h * (0.07 + Math.random() * 0.2),
                     k: pick(BIRDS), h: R.h * (0.02 + Math.random() * 0.02) });
      G.nextBird = R.w * (5 + Math.random() * 7);
    }
    for (var bi = G.birds.length - 1; bi >= 0; bi--) {
      G.birds[bi].x -= sp * 0.22;
      if (G.birds[bi].x < -60) G.birds.splice(bi, 1);
    }

    G.nextMid -= sp * 0.55;
    if (G.nextMid <= 0) { addMid(R.w + 40); G.nextMid = R.w * (0.55 + Math.random() * 0.9); }
    for (var mi = G.mid.length - 1; mi >= 0; mi--) {
      G.mid[mi].x -= sp * 0.55;
      if (G.mid[mi].x < -R.w * 0.4) G.mid.splice(mi, 1);
    }

    G.nextFore -= sp * 1.18;
    if (G.nextFore <= 0) { addFore(R.w + 30); G.nextFore = R.w * (0.2 + Math.random() * 0.45); }
    for (var fi = G.fore.length - 1; fi >= 0; fi--) {
      G.fore[fi].x -= sp * 1.18;
      if (G.fore[fi].x < -R.w * 0.3) G.fore.splice(fi, 1);
    }

    if (!idling && G.phase === 'run') {
      G.score += (G.speed * dt) / (R.figH * 0.42);
      G.speed += R.figH * 0.000025 * dt;         // a gentle build

      G.since += G.speed * dt;
      if (G.since > G.nextGap) {
        spawn();
        G.since = 0;
        // spacing scales with speed so the gap stays jumpable
        G.nextGap = G.speed * (72 + Math.random() * 62);
      }

      if (G.score >= 100) {
        G.score = 100;
        G.phase = 'meet';
        G.erikaX = R.w + R.figH * 1.2;
        // clear anything still between them
        G.obstacles = G.obstacles.filter(function (o) { return o.x < G.x; });
      }
    }

    if (idling) return;    // scenery drifts, but nothing to clear yet

    // move obstacles, test collision
    for (var j = G.obstacles.length - 1; j >= 0; j--) {
      var o = G.obstacles[j];
      o.x -= G.speed * dt;
      if (o.x + o.w < -10) { G.obstacles.splice(j, 1); continue; }
      if (hits(o)) { G.phase = 'over'; showOver(); return; }
    }

    if (G.phase === 'meet') {
      G.erikaX -= G.speed * dt;
      if (G.erikaX - G.x <= R.figH * 0.62) {
        G.erikaX = G.x + R.figH * 0.62;
        G.y = 0; G.vy = 0;
        G.phase = 'won';
        showWon();
      }
    }
  }

  function overlapsX(o) {
    var half = R.figH * 0.15;                 // forgiving body width
    var pad = (o.w - o.cw) / 2;               // centre the narrower hit box
    return (G.x + half > o.x + pad) && (G.x - half < o.x + o.w - pad);
  }

  function hits(o) {
    // grass at the foot of the sprite is scenery, not something to trip on
    var oTop = R.ground - o.h * 0.88;
    return overlapsX(o) && (R.ground - G.y) > oTop;
  }

  // ── Runner drawing ────────────────────────────────────────
  function drawRun() {
    rx.clearRect(0, 0, R.w, R.h);
    if (!G) { rx.fillStyle = CREAM; rx.fillRect(0, 0, R.w, R.h); return; }

    var pan = G.pan || 0;
    var hz = horizon();

    // sky, dawn over the lake: pale blue lifting to warm at the horizon
    var sky = rx.createLinearGradient(0, 0, 0, hz);
    sky.addColorStop(0, '#CFDFEC');
    sky.addColorStop(0.7, '#E8EAE4');
    sky.addColorStop(1, '#F2EFE4');
    rx.fillStyle = sky;
    rx.fillRect(0, 0, R.w, hz);
    // the near shore path, kept plain so the run reads clearly across it
    rx.fillStyle = '#EDE8DA';
    rx.fillRect(0, hz, R.w, R.ground - hz);

    drawBG('sun_02', R.w * 0.87, R.h * 0.11, R.h * 0.09, false, 0.7);

    for (var ci = 0; ci < G.clouds.length; ci++) {
      var cl = G.clouds[ci];
      drawBG(cl.k, cl.x + pan * 0.05, cl.y, cl.h, false, cl.a);
    }
    for (var bi = 0; bi < G.birds.length; bi++) {
      var bd = G.birds[bi];
      drawBG(bd.k, bd.x + pan * 0.22, bd.y, bd.h, false, 0.5);
    }

    // Fuji, the hills, the town and the lake all come in one piece, then a
    // single treeline standing on the near shore. Two bands, not six.
    tileSeamless('mountain_lake_backdrop', G.sky.backdrop - pan * 0.04, hz + R.h * 0.01, R.h * 0.62);
    // the treeline stands on the far side of the path, not on it
    tileSeamless('autumn_forest_row', G.sky.forest - pan * 0.26, hz + R.h * 0.018, R.h * 0.105);

    // scrub between the horizon and the path
    for (var mi = 0; mi < G.mid.length; mi++) {
      var m = G.mid[mi];
      drawBG(m.k, m.x + pan * 0.55, hz + m.drop, m.h, m.flip, m.a);
    }

    // Grass over earth in one strip, mirrored tile on tile so the joins fall
    // on matching columns and the grass never shows a break.
    rx.fillStyle = '#6E8C43';
    rx.fillRect(0, R.ground, R.w, R.h - R.ground);
    tileSeamless(G.groundKey, G.sky.ground - pan, R.h, R.h - R.ground);

    // weeds and stones nearest the eye, below the path so they cannot be
    // mistaken for something to jump
    for (var fi = 0; fi < G.fore.length; fi++) {
      var fo = G.fore[fi];
      drawBG(fo.k, fo.x + pan * 1.18, R.ground + fo.drop + R.h * 0.012, fo.h, fo.flip, 1);
    }

    for (var j = 0; j < G.obstacles.length; j++) drawObstacle(G.obstacles[j]);

    var feet = R.ground - G.y;
    if (G.phase === 'won') {
      drawEmbrace();
    } else {
      drawBrendan(G.x + (G.pan || 0), feet, G.y > 0.5);
      if (G.erikaX !== null) drawErika(G.erikaX + (G.pan || 0), R.ground);
    }

    drawScore();
  }

  function drawObstacle(o) {
    drawArt(o.art, o.x + o.w / 2 + (G.pan || 0), R.ground, o.h, false);
  }

  // Everyone is drawn facing right. Brendan runs that way, so he is never
  // flipped; Erika is waiting for him, so she is flipped to look back down
  // the field at him.
  function drawBrendan(x, feetY, airborne) {
    var key = G.phase === 'over' ? 'trip'
            : airborne ? 'jump'
            : RUN_KEYS[Math.floor(G.stride) % RUN_KEYS.length];
    drawArt(key, x, feetY, R.figH, false);
  }

  // she is drawn facing right, so flip her to look back at him
  function drawErika(x, feetY) {
    var near = (x - G.x) < R.figH * 1.6;
    drawArt(near ? 'spot' : 'wait', x, feetY, R.figH * 0.94, true);
  }

  function drawEmbrace() {
    var cx = (G.x + G.erikaX) / 2 + (G.pan || 0);
    drawArt('embrace', cx, R.ground, R.figH * 1.04, false);
  }

  function drawScore() {
    if (G.phase === 'ready') return;
    rx.fillStyle = SOFT;
    rx.font = '500 ' + Math.round(R.h * 0.032) + "px 'Jost', sans-serif";
    // left, so it never sits under the sun on a narrow frame
    rx.textAlign = 'left';
    rx.textBaseline = 'top';
    var s = Math.floor(G.score);
    rx.fillText(s + ' / 100', R.h * 0.035, R.h * 0.035);
  }

  function showWon() {
    stopLoop();
    // ease the pair into the middle of the frame for the moment itself
    var shift = R.w * 0.5 - (G.x + G.erikaX) / 2;
    var t0 = performance.now();
    (function pan(now) {
      var k = Math.min(1, (now - t0) / 600);
      G.pan = shift * (1 - Math.pow(1 - k, 3));
      drawRun();
      if (k < 1) requestAnimationFrame(pan);
    })(performance.now());
    winLine.textContent = 'and there she was';
    timeEl.textContent = 'a hundred out of a hundred';
    winEl.classList.add('show');
  }

  function showOver() {
    stopLoop();
    drawRun();
    overText.textContent = 'Tripped at ' + Math.floor(G.score) + '. She is still waiting.';
    overEl.classList.add('show');
  }

  function loop() {
    stopLoop();
    lastT = performance.now();
    raf = requestAnimationFrame(frame);
  }

  function frame(now) {
    var dt = Math.min(2.5, (now - lastT) / 16.667);
    lastT = now;
    tick(dt);
    drawRun();
    if (G && !G.paused && (G.phase === 'ready' || G.phase === 'run' || G.phase === 'meet')) {
      raf = requestAnimationFrame(frame);
    } else {
      raf = null;
    }
  }

  function stopLoop() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
  }

  rc.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    rc.focus();
    jump();
  });
  rc.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'ArrowUp' || e.key === 'Enter') {
      e.preventDefault();
      jump();
    }
  });

  // ── Swapping between the two ──────────────────────────────
  var COPY = {
    maze: {
      eyebrow: 'one more thing',
      title: 'Find each other',
      lede: 'Erika is at one end and Brendan is at the other. Draw the line that brings them together.',
      hint: 'Drag from <b>E</b> to <b>B</b><span class="kb"> &nbsp;·&nbsp; arrow keys work too</span>'
    },
    run: {
      eyebrow: 'a little detour',
      title: 'Run to her',
      lede: 'Erika is waiting at a hundred. Get Brendan over everything in the way.',
      hint: 'Tap, or press space, to jump'
    }
  };

  function setHint(html) {
    document.getElementById('hint').innerHTML = html;
  }

  function setCopy(which) {
    var els = [document.getElementById('eyebrow'), document.getElementById('title'),
               document.getElementById('lede'), document.getElementById('hint')];
    els.forEach(function (el) { el.classList.add('out'); });
    setTimeout(function () {
      document.getElementById('eyebrow').textContent = COPY[which].eyebrow;
      document.getElementById('title').textContent = COPY[which].title;
      document.getElementById('lede').textContent = COPY[which].lede;
      document.getElementById('hint').innerHTML = COPY[which].hint;
      els.forEach(function (el) { el.classList.remove('out'); });
    }, 280);
  }

  function goTo(which) {
    if (current === which) return;
    current = which;
    winEl.classList.remove('show');
    overEl.classList.remove('show');
    setCopy(which);
    track.style.transform = which === 'maze' ? 'translateX(-50%)' : 'translateX(0)';
    document.getElementById('mazeControls').hidden = (which !== 'maze');
    document.getElementById('runControls').hidden = (which === 'maze');

    if (which === 'run') {
      tuneJump();
      setHint('Tap, or press space, to start');
      if (artReady) {
        newGame();
        setTimeout(function () { rc.focus(); loop(); }, 650);
      } else {
        loadArt(function () { newGame(); rc.focus(); loop(); });
      }
    } else {
      stopLoop();
      setTimeout(function () { canvas.focus(); }, 650);
    }
  }

  document.getElementById('newBtn').addEventListener('click', newMaze);
  document.getElementById('clearBtn').addEventListener('click', clearLine);
  document.getElementById('nextBtn').addEventListener('click', function () { goTo('run'); });
  document.getElementById('backBtn').addEventListener('click', function () { goTo('maze'); });
  document.getElementById('restartBtn').addEventListener('click', function () {
    winEl.classList.remove('show');
    overEl.classList.remove('show');
    newGame();
    setHint('Tap, or press space, to start');
    rc.focus();
    loop();
  });

  // Resizing mid-run would otherwise leave obstacles at the old scale,
  // so carry a run in progress across the change.
  function relayout() {
    var oldFigH = R.figH, oldW = R.w;
    var prevCols = cols, prevRows = rows;
    layout();
    tuneJump();
    if (cols !== prevCols || rows !== prevRows) { generate(); clearLine(); }
    else draw();
    if (G) {
      // One factor for everything. Heights once scaled by the figure ratio
      // and gaps by the width ratio; rounding made those differ by a fraction
      // of a percent, which was enough to turn a marginal mid-air jump into a
      // collision.
      var fs = oldFigH ? R.figH / oldFigH : 1;
      var oldX = G.x;
      G.x = R.w * 0.16;
      // Gaps have to scale about Brendan, not about the origin: scaling from
      // zero drags anything just behind him back on top of him.
      G.y *= fs; G.vy *= fs;
      G.speed *= fs; G.nextGap *= fs; G.since *= fs;
      if (G.erikaX !== null) G.erikaX = G.x + (G.erikaX - oldX) * fs;
      if (G.pan) G.pan *= fs;
      G.obstacles.forEach(function (o) {
        o.x = G.x + (o.x - oldX) * fs;
        o.w *= fs; o.h *= fs; o.cw *= fs;
      });
      G.pebbles.forEach(function (pb) { pb.x = G.x + (pb.x - oldX) * fs; });
      // Clear anything he could not fairly react to on resuming: what he is
      // standing over, and anything already inside jumping distance.
      G.obstacles = G.obstacles.filter(function (o) {
        if (overlapsX(o)) return false;
        return (o.x + (o.w - o.cw) / 2) - G.x > R.figH * 1.3;
      });
      // Changing the size of the world under a run is disruptive however
      // carefully it is rescaled, so hold the run still and let the player
      // pick it back up when they are ready.
      if (G.phase === 'run' || G.phase === 'meet') {
        G.paused = true;
        stopLoop();
        setHint('Tap, or press space, to continue');
      }
      drawRun();
    }
  }

  // ── Full screen ───────────────────────────────────────────
  var expandBtn = document.getElementById('expandBtn');

  function setExpanded(on) {
    document.body.classList.toggle('expanded', on);
    expandBtn.textContent = on ? 'Exit full screen' : 'Full screen';
    relayout();
  }

  expandBtn.addEventListener('click', function () {
    var on = !document.body.classList.contains('expanded');
    if (on) {
      setExpanded(true);
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) {
        try {
          var pr = req.call(el);
          if (pr && pr.catch) pr.catch(function () {});
        } catch (e) {}
      }
    } else {
      var ex = document.exitFullscreen || document.webkitExitFullscreen;
      if ((document.fullscreenElement || document.webkitFullscreenElement) && ex) {
        try { ex.call(document); } catch (e) {}
      }
      setExpanded(false);
    }
  });

  // Escape leaves fullscreen without touching the button, so follow it back
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
    document.addEventListener(ev, function () {
      var fs = document.fullscreenElement || document.webkitFullscreenElement;
      if (!fs && document.body.classList.contains('expanded')) setExpanded(false);
    });
  });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(relayout, 150);
  });

  // Read-only view of the run, so the game can be exercised by a script
  // without guessing at pixels now that there is scenery behind it.
  window.__runState = function () {
    if (!G) return null;
    return {
      phase: G.phase, score: G.score, x: G.x, y: G.y, paused: !!G.paused,
      ground: R.ground, figH: R.figH, w: R.w, speed: G.speed,
      obstacles: G.obstacles.map(function (o) {
        return { x: o.x, w: o.w, h: o.h, cw: o.cw };
      })
    };
  };

  newMaze();
  tuneJump();
  // the run is the game you land on, so bring it up as soon as the art is in
  loadArt(function () {
    tuneJump();
    newGame();
    loop();
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { draw(); drawRun(); });
})();
</script>
</body>
</html>
